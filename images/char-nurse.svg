<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500">
  <!-- SHOES (nurse clogs / white) -->
  <ellipse cx="71" cy="490" rx="26" ry="13" fill="#E8EAF0"/>
  <ellipse cx="117" cy="490" rx="24" ry="13" fill="#E8EAF0"/>

  <!-- SCRUB PANTS (dark teal) -->
  <rect x="58" y="326" width="28" height="160" rx="13" fill="#2A6A5A"/>
  <rect x="108" y="326" width="28" height="160" rx="13" fill="#2A6A5A"/>

  <!-- SCRUB TOP (teal) -->
  <rect x="44" y="164" width="114" height="174" rx="15" fill="#3A8A7A"/>
  <!-- V-neck -->
  <polygon points="101,164 82,196 101,214 120,196" fill="#2A7060"/>
  <!-- Chest pocket -->
  <rect x="56" y="184" width="30" height="26" rx="5" fill="#2A7060" opacity="0.75"/>
  <!-- Pens in pocket -->
  <line x1="64" y1="184" x2="64" y2="196" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="70" y1="184" x2="70" y2="196" stroke="#FFD070" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <!-- ID badge -->
  <rect x="106" y="178" width="18" height="12" rx="3" fill="white" opacity="0.92"/>
  <rect x="108" y="180" width="14" height="8" rx="2" fill="#4A8AB0"/>
  <line x1="115" y1="175" x2="115" y2="178" stroke="#C0C0C0" stroke-width="2" stroke-linecap="round"/>

  <!-- SLEEVES -->
  <rect x="14" y="170" width="34" height="92" rx="16" fill="#3A8A7A"/>
  <rect x="154" y="170" width="34" height="92" rx="16" fill="#3A8A7A"/>

  <!-- ARMS + HANDS -->
  <!-- Left arm (at side, relaxed) -->
  <rect x="18" y="254" width="28" height="64" rx="13" fill="#C88A70"/>
  <ellipse cx="32" cy="325" rx="16" ry="12" fill="#C88A70"/>
  <!-- Right arm (raised, holding clipboard) -->
  <rect x="154" y="244" width="28" height="68" rx="13" fill="#C88A70"/>
  <ellipse cx="168" cy="318" rx="16" ry="12" fill="#C88A70"/>

  <!-- CLIPBOARD in right hand -->
  <rect x="152" y="295" width="42" height="56" rx="6" fill="#F0E8D0"/>
  <rect x="152" y="295" width="42" height="9" rx="5" fill="#C8A870"/>
  <!-- Clip -->
  <ellipse cx="173" cy="296" rx="8" ry="4" fill="#B09060"/>
  <!-- Lined paper -->
  <line x1="159" y1="316" x2="187" y2="316" stroke="#9A8860" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="159" y1="325" x2="187" y2="325" stroke="#9A8860" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="159" y1="334" x2="180" y2="334" stroke="#9A8860" stroke-width="1.5" stroke-linecap="round"/>

  <!-- NECK -->
  <rect x="86" y="150" width="28" height="22" rx="10" fill="#C88A70"/>

  <!-- HEAD -->
  <ellipse cx="100" cy="100" rx="50" ry="54" fill="#C88A70"/>
  <!-- Cheek shading -->
  <ellipse cx="72" cy="112" rx="15" ry="10" fill="#A86848" opacity="0.25"/>
  <ellipse cx="128" cy="112" rx="15" ry="10" fill="#A86848" opacity="0.25"/>
  <!-- Head highlight -->
  <ellipse cx="84" cy="80" rx="20" ry="15" fill="#DDA080" opacity="0.38"/>

  <!-- HAIR (dark, pulled back in a neat bun — practical) -->
  <!-- Top swept back -->
  <ellipse cx="100" cy="58" rx="48" ry="24" fill="#4A3020"/>
  <!-- Sides (pulled tight) -->
  <ellipse cx="52" cy="86" rx="15" ry="28" fill="#4A3020"/>
  <ellipse cx="148" cy="86" rx="15" ry="28" fill="#4A3020"/>
  <!-- Bun (right back, visible from front as side bump) -->
  <ellipse cx="148" cy="64" rx="18" ry="16" fill="#4A3020"/>
  <ellipse cx="148" cy="64" rx="13" ry="11" fill="#3A2010"/>
  <!-- Hair band hint -->
  <ellipse cx="142" cy="70" rx="5" ry="3" fill="#1A0A04" opacity="0.6"/>

  <!-- FACE — calm, professional, focused -->
  <!-- Eyebrows (level, composed) -->
  <path d="M74 90 C81 87 91 88 95 92" stroke="#3A2010" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  <path d="M126 90 C119 87 109 88 105 92" stroke="#3A2010" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- Eyes (alert, professional) -->
  <ellipse cx="83" cy="106" rx="12" ry="10" fill="#1E1008"/>
  <ellipse cx="117" cy="106" rx="12" ry="10" fill="#1E1008"/>
  <!-- Iris -->
  <ellipse cx="83" cy="108" rx="8" ry="8" fill="#4A3020"/>
  <ellipse cx="117" cy="108" rx="8" ry="8" fill="#4A3020"/>
  <!-- Pupil -->
  <ellipse cx="83" cy="108" rx="5" ry="5" fill="#0A0604"/>
  <ellipse cx="117" cy="108" rx="5" ry="5" fill="#0A0604"/>
  <!-- Glints -->
  <ellipse cx="87" cy="103" rx="3" ry="2.5" fill="white" opacity="0.7"/>
  <ellipse cx="121" cy="103" rx="3" ry="2.5" fill="white" opacity="0.7"/>

  <!-- Nose -->
  <path d="M95 118 Q100 127 105 118" stroke="#9A6848" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Mouth (neutral, composed — slight hint of focus) -->
  <path d="M87 134 Q100 131 113 134" stroke="#3A1808" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- Slight smile lines — approachable professional -->
  <line x1="87" y1="134" x2="85" y2="130" stroke="#9A6848" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="113" y1="134" x2="115" y2="130" stroke="#9A6848" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
