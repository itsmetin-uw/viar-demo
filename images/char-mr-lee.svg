<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500">
  <!-- SLIPPERS -->
  <ellipse cx="72" cy="488" rx="28" ry="13" fill="#8A9AB0"/>
  <ellipse cx="122" cy="486" rx="26" ry="13" fill="#8A9AB0"/>

  <!-- LEGS (visible below gown hem) -->
  <rect x="60" y="368" width="23" height="108" rx="11" fill="#D4956A"/>
  <rect x="113" y="368" width="23" height="106" rx="11" fill="#D4956A"/>

  <!-- HOSPITAL GOWN body -->
  <rect x="46" y="178" width="110" height="200" rx="16" fill="#90B8D8"/>
  <!-- Gown A-line hem -->
  <polygon points="46,346 156,346 170,378 32,378" fill="#90B8D8"/>
  <!-- Gown centre seam / open-back line (front view hint) -->
  <line x1="101" y1="178" x2="101" y2="310" stroke="#70A0C0" stroke-width="2" stroke-dasharray="6,5" opacity="0.6"/>
  <!-- Gown collar dots -->
  <circle cx="88" cy="188" r="3" fill="#70A0C0" opacity="0.7"/>
  <circle cx="114" cy="188" r="3" fill="#70A0C0" opacity="0.7"/>

  <!-- SLEEVES -->
  <rect x="16" y="185" width="34" height="88" rx="16" fill="#90B8D8"/>
  <rect x="152" y="185" width="34" height="88" rx="16" fill="#90B8D8"/>

  <!-- FOREARMS + HANDS -->
  <!-- Left arm (hanging, IV) -->
  <rect x="20" y="264" width="28" height="72" rx="13" fill="#D4956A"/>
  <ellipse cx="34" cy="342" rx="17" ry="13" fill="#D4956A"/>
  <!-- Right arm (drawn up toward chest — pain gesture) -->
  <rect x="152" y="254" width="28" height="68" rx="13" fill="#D4956A" transform="rotate(-8 152 254)"/>
  <ellipse cx="166" cy="326" rx="17" ry="13" fill="#D4956A"/>

  <!-- IV line on left arm -->
  <line x1="26" y1="272" x2="4" y2="145" stroke="#C0D0E0" stroke-width="2.5" stroke-dasharray="6,4" stroke-linecap="round"/>
  <!-- IV bag (top-left corner) -->
  <line x1="4" y1="110" x2="4" y2="144" stroke="#B8C8D8" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="-4" y="76" width="22" height="36" rx="7" fill="#D8EEF8" stroke="#B0C8D8" stroke-width="1.5"/>
  <ellipse cx="4" cy="76" rx="6" ry="4" fill="#B0C8D8"/>

  <!-- Hospital wristband on right wrist -->
  <rect x="150" y="316" width="28" height="10" rx="5" fill="white" opacity="0.95"/>
  <rect x="152" y="318" width="24" height="6" rx="3" fill="#5A9ABE"/>

  <!-- NECK -->
  <rect x="86" y="156" width="28" height="30" rx="10" fill="#D4956A"/>

  <!-- HEAD -->
  <ellipse cx="100" cy="108" rx="50" ry="54" fill="#D4956A"/>
  <!-- Cheek shading -->
  <ellipse cx="74" cy="118" rx="14" ry="10" fill="#C07858" opacity="0.3"/>
  <ellipse cx="126" cy="118" rx="14" ry="10" fill="#C07858" opacity="0.3"/>
  <!-- Head highlight -->
  <ellipse cx="84" cy="86" rx="22" ry="16" fill="#E8B090" opacity="0.38"/>

  <!-- HAIR (dark, graying at temples — elderly male) -->
  <ellipse cx="100" cy="64" rx="48" ry="25" fill="#3A2820"/>
  <ellipse cx="52" cy="88" rx="18" ry="32" fill="#3A2820"/>
  <ellipse cx="148" cy="88" rx="18" ry="32" fill="#3A2820"/>
  <!-- Gray temples overlay -->
  <ellipse cx="53" cy="92" rx="11" ry="20" fill="#7A6858"/>
  <ellipse cx="147" cy="92" rx="11" ry="20" fill="#7A6858"/>

  <!-- FACE — pain expression -->
  <!-- Furrowed brows -->
  <path d="M72 98 C79 93 88 95 92 100" stroke="#3A2820" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M128 98 C121 93 112 95 108 100" stroke="#3A2820" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- Pain crease between brows -->
  <line x1="96" y1="98" x2="100" y2="106" stroke="#A06840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
  <line x1="104" y1="98" x2="100" y2="106" stroke="#A06840" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

  <!-- Eyes (squinting) -->
  <ellipse cx="82" cy="114" rx="11" ry="7" fill="#1E1008"/>
  <ellipse cx="118" cy="114" rx="11" ry="7" fill="#1E1008"/>
  <!-- Eye glints -->
  <ellipse cx="86" cy="110" rx="3.5" ry="2.5" fill="white" opacity="0.55"/>
  <ellipse cx="122" cy="110" rx="3.5" ry="2.5" fill="white" opacity="0.55"/>

  <!-- Nose -->
  <path d="M95 124 Q100 134 105 124" stroke="#A07050" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Grimace mouth -->
  <path d="M84 140 Q100 136 116 140" stroke="#3A1A08" stroke-width="2.8" fill="none" stroke-linecap="round"/>

  <!-- Age / fatigue lines -->
  <path d="M70 122 C68 130 70 138 68 145" stroke="#A07050" stroke-width="1" fill="none" opacity="0.45"/>
  <path d="M130 122 C132 130 130 138 132 145" stroke="#A07050" stroke-width="1" fill="none" opacity="0.45"/>
</svg>
