<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500">
  <!-- SHOES -->
  <ellipse cx="72" cy="490" rx="26" ry="12" fill="#2A1A14"/>
  <ellipse cx="118" cy="490" rx="24" ry="12" fill="#2A1A14"/>

  <!-- PANTS (navy) -->
  <rect x="58" y="328" width="28" height="158" rx="13" fill="#3A4A6A"/>
  <rect x="108" y="328" width="28" height="158" rx="13" fill="#3A4A6A"/>

  <!-- CASUAL TOP (warm rust / sienna — concerned family member energy) -->
  <rect x="44" y="162" width="114" height="178" rx="16" fill="#C4785A"/>
  <!-- Collar / scoop neck -->
  <ellipse cx="101" cy="164" rx="34" ry="16" fill="#B46848"/>
  <!-- Subtle fabric fold lines -->
  <line x1="101" y1="180" x2="96" y2="300" stroke="#B06040" stroke-width="1.5" opacity="0.35"/>
  <line x1="101" y1="180" x2="108" y2="300" stroke="#B06040" stroke-width="1.5" opacity="0.25"/>

  <!-- ARMS — crossed (worried / defensive body language) -->
  <!-- Left sleeve -->
  <rect x="14" y="168" width="34" height="90" rx="16" fill="#C4785A"/>
  <!-- Right sleeve -->
  <rect x="154" y="168" width="34" height="90" rx="16" fill="#C4785A"/>
  <!-- Left forearm crossing to right (over stomach) -->
  <rect x="36" y="256" width="100" height="26" rx="13" fill="#D4956A" transform="rotate(6 36 256)"/>
  <!-- Right forearm crossing to left (on top) -->
  <rect x="62" y="252" width="100" height="26" rx="13" fill="#C88A70" transform="rotate(-8 62 252)"/>
  <!-- Hands visible at ends -->
  <ellipse cx="44" cy="272" rx="16" ry="13" fill="#D4956A"/>
  <ellipse cx="154" cy="268" rx="16" ry="13" fill="#C88A70"/>

  <!-- NECK -->
  <rect x="85" y="148" width="30" height="22" rx="10" fill="#D4956A"/>

  <!-- HEAD -->
  <ellipse cx="100" cy="100" rx="50" ry="54" fill="#D4956A"/>
  <!-- Cheek shading -->
  <ellipse cx="72" cy="112" rx="16" ry="11" fill="#C07858" opacity="0.28"/>
  <ellipse cx="128" cy="112" rx="16" ry="11" fill="#C07858" opacity="0.28"/>
  <!-- Head highlight -->
  <ellipse cx="84" cy="78" rx="20" ry="15" fill="#E8B090" opacity="0.38"/>

  <!-- HAIR (dark, shoulder-length, slight wave — middle-aged) -->
  <!-- Top mass -->
  <ellipse cx="100" cy="56" rx="48" ry="24" fill="#2A1A10"/>
  <!-- Left side / shoulder fall -->
  <ellipse cx="50" cy="102" rx="20" ry="52" fill="#2A1A10"/>
  <!-- Right side -->
  <ellipse cx="150" cy="102" rx="20" ry="52" fill="#2A1A10"/>
  <!-- Hair bottom bridge (joins sides) -->
  <rect x="50" y="130" width="100" height="28" rx="8" fill="#2A1A10"/>
  <!-- A few gray streaks for mid-age realism -->
  <line x1="58" y1="88" x2="50" y2="148" stroke="#8A7868" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
  <line x1="142" y1="88" x2="150" y2="148" stroke="#8A7868" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- FACE — worried expression -->
  <!-- Raised / angled inner brows (concern) -->
  <path d="M70 90 C78 84 88 86 92 91" stroke="#2A1A10" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M130 90 C122 84 112 86 108 91" stroke="#2A1A10" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- Worry crease on forehead -->
  <path d="M84 78 Q100 74 116 78" stroke="#A07050" stroke-width="1.2" fill="none" opacity="0.45"/>
  <path d="M88 72 Q100 68 112 72" stroke="#A07050" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Eyes (wide, searching) -->
  <ellipse cx="82" cy="106" rx="12" ry="11" fill="#1E1008"/>
  <ellipse cx="118" cy="106" rx="12" ry="11" fill="#1E1008"/>
  <!-- Whites visible — wide eyes -->
  <ellipse cx="82" cy="104" rx="12" ry="8" fill="white" opacity="0.18"/>
  <ellipse cx="118" cy="104" rx="12" ry="8" fill="white" opacity="0.18"/>
  <!-- Iris -->
  <ellipse cx="82" cy="108" rx="8" ry="9" fill="#3A2010"/>
  <ellipse cx="118" cy="108" rx="8" ry="9" fill="#3A2010"/>
  <!-- Pupil -->
  <ellipse cx="82" cy="108" rx="5" ry="6" fill="#0A0804"/>
  <ellipse cx="118" cy="108" rx="5" ry="6" fill="#0A0804"/>
  <!-- Glints -->
  <ellipse cx="86" cy="104" rx="3" ry="2.5" fill="white" opacity="0.7"/>
  <ellipse cx="122" cy="104" rx="3" ry="2.5" fill="white" opacity="0.7"/>

  <!-- Nose -->
  <path d="M95 118 Q100 127 105 118" stroke="#A07050" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Mouth (slightly open — about to speak / distressed) -->
  <path d="M86 134 Q100 131 114 134" stroke="#3A1808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Slight downward pull at corners -->
  <line x1="86" y1="134" x2="84" y2="138" stroke="#8A5030" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <line x1="114" y1="134" x2="116" y2="138" stroke="#8A5030" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Nasolabial folds (real stress marker) -->
  <path d="M73 118 C70 126 72 134 70 140" stroke="#A07050" stroke-width="1" fill="none" opacity="0.4"/>
  <path d="M127 118 C130 126 128 134 130 140" stroke="#A07050" stroke-width="1" fill="none" opacity="0.4"/>
</svg>
