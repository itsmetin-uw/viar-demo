<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 500">
  <!-- SHOES (dark oxford) -->
  <ellipse cx="70" cy="492" rx="28" ry="12" fill="#1A1824"/>
  <ellipse cx="120" cy="492" rx="26" ry="12" fill="#1A1824"/>

  <!-- DRESS PANTS (dark navy) -->
  <rect x="58" y="330" width="28" height="158" rx="13" fill="#24304E"/>
  <rect x="110" y="330" width="28" height="158" rx="13" fill="#24304E"/>

  <!-- WHITE COAT (main body) -->
  <rect x="38" y="160" width="126" height="184" rx="16" fill="#F0F2F6"/>
  <!-- Coat seam / button line -->
  <line x1="101" y1="162" x2="101" y2="342" stroke="#D8DCE4" stroke-width="2"/>
  <!-- Left lapel -->
  <polygon points="101,162 76,196 101,220" fill="#E4E8F0"/>
  <!-- Right lapel -->
  <polygon points="101,162 126,196 101,220" fill="#E8ECF4"/>
  <!-- Left pocket -->
  <rect x="48" y="252" width="36" height="28" rx="5" fill="#E0E4EC" opacity="0.8"/>
  <!-- Right pocket -->
  <rect x="118" y="252" width="36" height="28" rx="5" fill="#E0E4EC" opacity="0.8"/>
  <!-- Shirt/tie visible under coat -->
  <ellipse cx="101" cy="167" rx="20" ry="12" fill="#3A5080"/>
  <!-- Tie (small, visible) -->
  <polygon points="101,178 96,225 101,232 106,225" fill="#7A3A5A" opacity="0.85"/>

  <!-- COAT SLEEVES -->
  <rect x="12" y="166" width="30" height="100" rx="15" fill="#F0F2F6"/>
  <rect x="160" y="166" width="30" height="100" rx="15" fill="#F0F2F6"/>

  <!-- ARMS + HANDS -->
  <!-- Left arm — slightly raised forward (gesture: "listen to me") -->
  <rect x="16" y="256" width="24" height="62" rx="11" fill="#C88A60" transform="rotate(-6 16 256)"/>
  <ellipse cx="26" cy="322" rx="15" ry="11" fill="#C88A60"/>
  <!-- Right arm (at side, coat pocket) -->
  <rect x="162" y="258" width="24" height="60" rx="11" fill="#C88A60"/>
  <ellipse cx="174" cy="323" rx="15" ry="11" fill="#C88A60"/>

  <!-- STETHOSCOPE (drapes from neck to pocket) -->
  <!-- Left drape -->
  <path d="M80 168 Q56 208 52 242 Q50 262 64 264" stroke="#6A7A8A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Right drape -->
  <path d="M122 168 Q148 208 150 242 Q152 262 138 264" stroke="#6A7A8A" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <!-- Chest piece -->
  <ellipse cx="101" cy="265" rx="16" ry="10" fill="#6A7A8A"/>
  <ellipse cx="101" cy="265" rx="11" ry="7" fill="#4A5A6A"/>
  <ellipse cx="101" cy="265" rx="6" ry="4" fill="#8A9AAA" opacity="0.5"/>

  <!-- NECK -->
  <rect x="87" y="147" width="28" height="22" rx="10" fill="#C88A60"/>

  <!-- HEAD -->
  <ellipse cx="101" cy="97" rx="50" ry="54" fill="#C88A60"/>
  <!-- Cheek shading -->
  <ellipse cx="73" cy="110" rx="14" ry="10" fill="#A06840" opacity="0.22"/>
  <ellipse cx="129" cy="110" rx="14" ry="10" fill="#A06840" opacity="0.22"/>
  <!-- Head highlight -->
  <ellipse cx="85" cy="76" rx="21" ry="16" fill="#DCA070" opacity="0.36"/>

  <!-- HAIR (short, professional, slightly receding hairline — authority read) -->
  <ellipse cx="101" cy="53" rx="48" ry="25" fill="#2A1A0C"/>
  <!-- Sides (shorter, neat) -->
  <ellipse cx="53" cy="78" rx="14" ry="26" fill="#2A1A0C"/>
  <ellipse cx="149" cy="78" rx="14" ry="26" fill="#2A1A0C"/>
  <!-- Slight temple gray -->
  <ellipse cx="53" cy="82" rx="9" ry="16" fill="#6A5848" opacity="0.55"/>
  <ellipse cx="149" cy="82" rx="9" ry="16" fill="#6A5848" opacity="0.55"/>

  <!-- FACE — impatient, tense, pressed for time -->
  <!-- Brows (slightly furrowed inward — impatience / authority) -->
  <path d="M72 88 C79 83 89 85 94 90" stroke="#2A1808" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <path d="M130 88 C123 83 113 85 108 90" stroke="#2A1808" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <!-- Forehead crease from long career -->
  <path d="M85 76 Q101 72 117 76" stroke="#9A6840" stroke-width="1.2" fill="none" opacity="0.4"/>

  <!-- Eyes (direct, intense) -->
  <ellipse cx="82" cy="104" rx="12" ry="10" fill="#1A1008"/>
  <ellipse cx="120" cy="104" rx="12" ry="10" fill="#1A1008"/>
  <!-- Iris -->
  <ellipse cx="82" cy="106" rx="8" ry="8" fill="#3A2810"/>
  <ellipse cx="120" cy="106" rx="8" ry="8" fill="#3A2810"/>
  <!-- Pupil -->
  <ellipse cx="82" cy="106" rx="5" ry="5" fill="#080604"/>
  <ellipse cx="120" cy="106" rx="5" ry="5" fill="#080604"/>
  <!-- Glints -->
  <ellipse cx="86" cy="101" rx="3.2" ry="2.5" fill="white" opacity="0.65"/>
  <ellipse cx="124" cy="101" rx="3.2" ry="2.5" fill="white" opacity="0.65"/>

  <!-- Nose (slightly stronger bridge — characterful) -->
  <path d="M96 116 Q101 126 106 116" stroke="#9A6840" stroke-width="2" fill="none" stroke-linecap="round"/>
  <line x1="97" y1="104" x2="96" y2="116" stroke="#9A6840" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>
  <line x1="105" y1="104" x2="106" y2="116" stroke="#9A6840" stroke-width="1.2" stroke-linecap="round" opacity="0.4"/>

  <!-- Mouth (thin, set line — controlled impatience) -->
  <path d="M85 132 Q101 129 117 132" stroke="#3A1808" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Corner tension marks -->
  <line x1="85" y1="132" x2="82" y2="129" stroke="#8A5030" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  <line x1="117" y1="132" x2="120" y2="129" stroke="#8A5030" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>

  <!-- Jaw shadow for strong presence -->
  <ellipse cx="101" cy="146" rx="35" ry="8" fill="#A06840" opacity="0.15"/>
</svg>
